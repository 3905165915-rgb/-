limit_req_zone $binary_remote_addr zone=hulao_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hulao_ai:1m rate=10r/m;

server {
    listen 80;
    server_name 99211314.xyz www.99211314.xyz 47.104.11.172;
    return 301 https://99211314.xyz$request_uri;
}

server {
    listen 443 ssl;
    server_name 99211314.xyz www.99211314.xyz;
    ssl_certificate /etc/letsencrypt/live/99211314.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/99211314.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /opt/hulaozhijiao/web/admin;
    index index.html;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /api/v1/auth/login {
        limit_req zone=hulao_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/records/extract {
        limit_req zone=hulao_ai burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /api/v1/speech/transcriptions {
        client_max_body_size 3m;
        client_body_timeout 20s;
        limit_req zone=hulao_ai burst=2 nodelay;
        limit_req_status 429;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # Other paid AI routes need the same limits as ordinary extraction.
    location ~ ^/api/v1/(records/context-extract|handovers/[^/]+/ai-summary|quality/checks)$ {
        client_max_body_size 64k;
        limit_req zone=hulao_ai burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
    }
    location = /mobile { return 302 /mobile/; }
    location /mobile/ {
        alias /opt/hulaozhijiao/web/mobile/;
        try_files $uri $uri/ /mobile/index.html;
    }
    location ~ ^/mobile/assets/.*\.(js|css)$ {
        root /opt/hulaozhijiao/web;
        try_files $uri =404;
        expires 7d;
    }
    location ~ ^/assets/.*\.(js|css)$ {
        try_files $uri =404;
        expires 7d;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
